[package]
name = "baner-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Baner core: storage, crypto, git sync, secrets"

[dependencies]
age = "0.12"
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-openssl", "vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
tempfile = "3"
