[package]
name = "baner"
version = "0.1.5"
description = "Baner: 超轻量分块记事板"
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "baner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
baner-core = { path = "../crates/baner-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

# 自动更新只在桌面上(ADR-0010);iOS 靠连线重新部署
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"



# iOS:密钥文件所在目录不进 iCloud / 电脑备份(ADR-0008)
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString", "NSValue", "NSError", "NSObject"] }
